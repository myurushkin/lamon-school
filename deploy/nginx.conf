# /etc/nginx/sites-available/lamon
# Статика Astro из /var/www/lamon. HTTPS добавляет certbot (см. setup-server.sh).
server {
    server_name lamon.school www.lamon.school 194.113.35.217;

    root /var/www/lamon;
    index index.html;

    # форма заявок -> локальный сервис (deploy/lead-bot)
    location /api/lead {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        client_max_body_size 8k;
    }

    # /blog -> /blog/index.html, чистые URL без .html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # кеш для собранных ассетов (имена с хешем)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    error_page 404 /404.html;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lamon.school/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lamon.school/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.lamon.school) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = lamon.school) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name lamon.school www.lamon.school 194.113.35.217;
    return 301 https://lamon.school$request_uri;




}