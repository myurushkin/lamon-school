# /etc/nginx/sites-available/lamon
# Статика Astro из /var/www/lamon. HTTPS добавляет certbot (см. setup-server.sh).
server {
    listen 80;
    listen [::]:80;
    server_name lamon.school www.lamon.school 194.113.35.217;

    root /var/www/lamon;
    index index.html;

    # форма заявок -> локальный сервис (deploy/lead-bot)
    location /api/lead {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        client_max_body_size 8k;
    }

    # /blog -> /blog/index.html, чистые URL без .html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # кеш для собранных ассетов (имена с хешем)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    error_page 404 /404.html;
}
